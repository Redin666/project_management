name: Update Phase 1 progress

on:
  issues:
    types: [opened, closed, reopened, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Phase 1 progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ["REPOSITORY"]

          result = subprocess.run(
              [
                  "gh", "issue", "list",
                  "--repo", repo,
                  "--state", "all",
                  "--limit", "200",
                  "--json", "title,state"
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          issues = json.loads(result.stdout)
          phase = [i for i in issues if i["title"].startswith("[Фаза 1]")]

          total = len(phase)
          closed = sum(1 for i in phase if i["state"] == "CLOSED")
          percent = round(closed / total * 100) if total else 0

          if percent == 100:
              color = "brightgreen"
          elif percent >= 50:
              color = "yellow"
          elif percent > 0:
              color = "orange"
          else:
              color = "lightgrey"

          block = f"""<!-- PHASE1_PROGRESS_START -->
![Прогресс Фазы 1](https://img.shields.io/badge/Прогресс-{percent}%25-{color})

**Выполнено:** {closed} из {total} задач
<!-- PHASE1_PROGRESS_END -->"""

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- PHASE1_PROGRESS_START -->.*?<!-- PHASE1_PROGRESS_END -->"
          updated, count = re.subn(pattern, block, readme, count=1, flags=re.S)

          if count != 1:
              raise SystemExit("Не найден блок прогресса Фазы 1 в README.md")

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Phase 1: {closed}/{total} = {percent}%")
          PY

      - name: Commit changed progress
        run: |
          if git diff --quiet README.md; then
            echo "Progress is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update Phase 1 progress"
          git push
